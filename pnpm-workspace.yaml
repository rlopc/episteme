packages:
  - frontend
# 7-day cooldown for new releases, in minutes.
minimumReleaseAge: 10080
# Security fix through a dependency that has not released it yet. Remove when
# markdownlint-cli2 depends on markdownlint 0.42.1 or later (re2js >= 2.8.7).
overrides:
  # GHSA-gg6h-894w-4m9c (high): re2js < 2.8.7, through markdownlint 0.42.0.
  re2js: 2.9.1
# Advisories accepted as tolerable (dev-only, no fixed release). Remove each
# when a fixed version exists; see docs/standards/repository.md.
audit:
  ignore:
    # GHSA-fc5q-39xc-vjpf (high): picomatch <= 4.0.7 ReDoS, through
    # markdownlint-cli2, ESLint and other dev tools.
    - GHSA-fc5q-39xc-vjpf
