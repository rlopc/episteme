# cspell checks the prose: Markdown, in Spanish and English. codespell checks
# everything else ([tool.codespell] in pyproject.toml). The VS Code extension
# reads this same file.
version: "0.2"
language: es,es-ES,en,en-US
import:
  - "@cspell/dict-es-es/cspell-ext.json"
# Gitignored files (node_modules/, .dev/, local files) are skipped.
useGitignore: true
ignorePaths:
  # Generated by OpenSpec; regenerate with `openspec update`.
  - .claude/commands/opsx/**
  - .claude/skills/openspec-*/**
  # Generated by release-please.
  - CHANGELOG.md
# cspell does not enable these software dictionaries for Markdown, which
# names the same tools.
dictionaries:
  - softwareTerms
  - python
  - node
  - npm
  - typescript
  - bash
  - docker
  - fullstack
  - filetypes
  - companies
  - git
# Lowercase: the Spanish dictionary turns on caseSensitive, and a lowercase
# word also accepts its capitalized and uppercase forms.
words:
  - actionlint
  - amannn
  - arcadedb
  - autocommit
  - autorelease
  - bloqueante
  - bubblewrap
  - checkpointer
  - claude
  - conftest
  - cooldowns
  - codespell
  - cori
  - cytoscape
  - datetimes
  - devcontainers
