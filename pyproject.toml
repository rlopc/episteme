# uv workspace root: one uv.lock, one .venv and one .python-version for the
# repository. The root is not a package; it holds the repository's Python tools,
# as the root package.json does for Node. The application is the member backend/.
# Install everything with `just setup` (`uv sync --locked --all-packages`): a
# plain `uv sync` installs only one part and removes the rest.
[project]
name = "episteme-workspace"
version = "0.0.0"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"

[dependency-groups]
dev = [
    "codespell==2.4.3",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
]

# uv reads [tool.uv] only here, for every member.
[tool.uv]
package = false
required-version = ">=0.13.6,<0.14"
# The cooldown (docs/standards/README.md, versions policy).
exclude-newer = "7 days"

# Ruff for the Python outside backend/ (the Claude Code hooks, standard library
# only): default rules, with the project's Python (requires-python). backend/
# has its own configuration.
[tool.ruff]

[tool.uv.workspace]
members = ["backend"]

# codespell for everything but Markdown, which cspell checks (cspell.config.yaml).
[tool.codespell]
# Markdown and generated files. The leading * matches paths with and without ./.
# codespell does not read .gitignore: run it through pre-commit, which passes
# only versioned files; the bare folder names only spare a plain run the worst.
skip = "*.md,uv.lock,pnpm-lock.yaml,mise.lock,CHANGELOG.md,.release-please-manifest.json,*backend/schemas/*,*frontend/src/contract/*,*.claude/commands/opsx/*,*.claude/skills/openspec-*,.git,node_modules,.venv"
# Hidden files are skipped even when passed by name, such as .pre-commit-config.yaml.
check-hidden = true
# hel: a partial token in the streaming tests. afterall: Vitest's afterAll.
# The rest are Spanish, in .claude/; remove them once it is translated.
ignore-words-list = "hel,afterall,autor,caracteres,comando,comandos,fiel,hace"
